[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "fintoolsom"
dynamic = ["version"]
description = "Personal library for finantial calculations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Oliver Mohr B.", email = "oliver.mohr.b@gmail.com" },
]
keywords = ["fixed income", "dates", "rates", "curves"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Natural Language :: English",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "holidays>=0.88",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/oliverm91/fintoolsom"

[dependency-groups]
dev = [
    "commitizen>=4.16.4",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff",
    "sqlalchemy>=2.1.8",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
update_changelog_on_bump = true
tag_format = "v$version"

[tool.scikit-build]
minimum-version = "build-system.requires"
# CMake 4.2+ knows the Visual Studio 2026 generator; scikit-build-core downloads it
# when the system one is older.
cmake.version = ">=4.2"
cmake.build-type = "Release"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["src/fintoolsom"]
# Subpackage READMEs are for the repository, not for installs.
wheel.exclude = ["**/README.md"]
build-dir = "build/{wheel_tag}"

[tool.setuptools_scm]

[tool.uv]
# Rebuild the C++ extension whenever its sources or build files change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*.cpp" },
    { file = "cpp/**/*.hpp" },
]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
test-requires = ["pytest"]
# Parity of the C++ and Python curves, on the installed wheel.
test-command = "pytest {project}/tests/unit/rates {project}/tests/unit/test_settings.py -q -p no:cacheprovider"

[tool.cibuildwheel.macos]
# Each runner builds its own architecture (publish.yml: an Intel and an Apple-silicon
# runner), so every wheel is tested natively. C++23 library features need macOS 11.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# CLBonds / NelsonSiegelSvensson tests still use the legacy ZeroCouponCurve on purpose.
filterwarnings = ["ignore:ZeroCouponCurve is legacy:DeprecationWarning"]

[tool.coverage.run]
source = ["fintoolsom"]
branch = false
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
